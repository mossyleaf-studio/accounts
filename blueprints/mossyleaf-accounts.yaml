version: 1
metadata:
  name: mossyleaf - Accounts
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Invalidation flow
      required: false
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - User settings flow
      required: false
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - TOTP MFA setup flow
      required: false
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - WebAuthn MFA setup flow
      required: false
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Static MFA setup flow
      required: false

  - model: authentik_policies_password.passwordpolicy
    id: password-policy
    identifiers:
      name: mossyleaf-password-policy
    attrs:
      password_field: password
      length_min: 12
      check_static_rules: true
      check_zxcvbn: false
      check_have_i_been_pwned: false
      amount_digits: 0
      amount_lowercase: 0
      amount_uppercase: 0
      amount_symbols: 0
      error_message: Use at least 12 characters.

  - model: authentik_stages_prompt.prompt
    id: field-password
    identifiers:
      name: mossyleaf-field-password
    attrs:
      field_key: password
      label: New password
      type: password
      required: true
      placeholder: At least 12 characters
      placeholder_expression: false
      order: 0
  - model: authentik_stages_prompt.prompt
    id: field-password-repeat
    identifiers:
      name: mossyleaf-field-password-repeat
    attrs:
      field_key: password_repeat
      label: Repeat the password
      type: password
      required: true
      placeholder: Same password again
      placeholder_expression: false
      order: 1
  - model: authentik_stages_prompt.promptstage
    id: password-prompt
    identifiers:
      name: mossyleaf-password-prompt
    attrs:
      fields:
        - !KeyOf field-password
        - !KeyOf field-password-repeat
      validation_policies:
        - !KeyOf password-policy
  - model: authentik_stages_user_write.userwritestage
    id: user-write
    identifiers:
      name: mossyleaf-user-write
    attrs:
      user_creation_mode: never_create

  - model: authentik_stages_user_login.userloginstage
    id: user-login
    identifiers:
      name: mossyleaf-login
    attrs:
      session_duration: days=30
      remember_me_offset: seconds=0

  - model: authentik_flows.flow
    id: password-change-flow
    identifiers:
      slug: mossyleaf-password-change
    attrs:
      name: mossyleaf - Change password
      title: Change your password
      designation: stage_configuration
      authentication: require_authenticated
      compatibility_mode: true
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf password-change-flow
      stage: !KeyOf password-prompt
      order: 10
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf password-change-flow
      stage: !KeyOf user-write
      order: 20

  - model: authentik_stages_email.emailstage
    id: recovery-email
    identifiers:
      name: mossyleaf-recovery-email
    attrs:
      use_global_settings: true
      subject: Nouveau mot de passe mossyleaf · Reset your mossyleaf password
      template: email/mossyleaf-password-reset.html
      token_expiry: minutes=30
      activate_user_on_success: true
  - model: authentik_stages_email.emailstage
    id: invitation-email
    identifiers:
      name: mossyleaf-invitation-email
    attrs:
      use_global_settings: true
      subject: Votre compte mossyleaf · Your mossyleaf account
      template: email/mossyleaf-invitation.html
      token_expiry: days=7
      activate_user_on_success: true

  # injust and personal send from their own address: the global settings only have one sender.
  - model: authentik_stages_email.emailstage
    id: injust-recovery-email
    identifiers:
      name: injust-recovery-email
    attrs: &own-smtp
      use_global_settings: false
      host: !Env [AUTHENTIK_EMAIL__HOST, localhost]
      port: !Env [AUTHENTIK_EMAIL__PORT, 25]
      username: !Env [AUTHENTIK_EMAIL__USERNAME, ""]
      password: !Env [AUTHENTIK_EMAIL__PASSWORD, ""]
      use_tls: !Env [AUTHENTIK_EMAIL__USE_TLS, false]
      use_ssl: !Env [AUTHENTIK_EMAIL__USE_SSL, false]
      from_address: !Env [INJUST_EMAIL_FROM, accounts@injustmusic.com]
      subject: Nouveau mot de passe Injust · Reset your Injust password
      template: email/injust-password-reset.html
      token_expiry: minutes=30
      activate_user_on_success: true
  - model: authentik_stages_email.emailstage
    id: injust-invitation-email
    identifiers:
      name: injust-invitation-email
    attrs:
      <<: *own-smtp
      subject: Votre compte Injust · Your Injust account
      template: email/injust-invitation.html
      token_expiry: days=7
  - model: authentik_stages_email.emailstage
    id: personal-recovery-email
    identifiers:
      name: personal-recovery-email
    attrs:
      <<: *own-smtp
      from_address: !Env [PERSONAL_EMAIL_FROM, accounts@duprat.cloud]
      subject: Nouveau mot de passe duprat.cloud · Reset your duprat.cloud password
      template: email/personal-password-reset.html
  - model: authentik_stages_email.emailstage
    id: personal-invitation-email
    identifiers:
      name: personal-invitation-email
    attrs:
      <<: *own-smtp
      from_address: !Env [PERSONAL_EMAIL_FROM, accounts@duprat.cloud]
      subject: Votre compte duprat.cloud · Your duprat.cloud account
      template: email/personal-invitation.html
      token_expiry: days=7

  # One brand per context; a flow step meant for one context is gated on the brand's `context` attribute.
  - model: authentik_policies_expression.expressionpolicy
    id: brand-mossyleaf
    identifiers:
      name: brand-is-mossyleaf
    attrs:
      # Fallback for any other brand too, so recovery always sends an email.
      expression: return request.http_request.brand.attributes.get("context") not in ("injust", "personal")
  - model: authentik_policies_expression.expressionpolicy
    id: brand-injust
    identifiers:
      name: brand-is-injust
    attrs:
      expression: return request.http_request.brand.attributes.get("context") == "injust"
  - model: authentik_policies_expression.expressionpolicy
    id: brand-personal
    identifiers:
      name: brand-is-personal
    attrs:
      expression: return request.http_request.brand.attributes.get("context") == "personal"

  - model: authentik_stages_identification.identificationstage
    id: recovery-identification
    identifiers:
      name: mossyleaf-recovery-identification
    attrs:
      user_fields:
        - email
      pretend_user_exists: true
      show_matched_user: false
  - model: authentik_policies_expression.expressionpolicy
    id: recovery-unknown-user
    identifiers:
      name: mossyleaf-recovery-unknown-user
    attrs:
      expression: |
        return not request.context.get("pending_user")
  - model: authentik_flows.flow
    id: recovery-flow
    identifiers:
      slug: mossyleaf-recovery
    attrs:
      name: mossyleaf - Recovery
      title: Choose a new password
      designation: recovery
      authentication: require_unauthenticated
      compatibility_mode: true
  - model: authentik_flows.flowstagebinding
    id: recovery-identification-binding
    identifiers:
      target: !KeyOf recovery-flow
      stage: !KeyOf recovery-identification
      order: 10
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: true
  # Gated at run time only: the planner caches one plan per flow and user, whatever the brand.
  - model: authentik_flows.flowstagebinding
    id: recovery-email-mossyleaf-binding
    identifiers:
      target: !KeyOf recovery-flow
      stage: !KeyOf recovery-email
      order: 20
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf recovery-email-mossyleaf-binding
      policy: !KeyOf brand-mossyleaf
      order: 0
  - model: authentik_flows.flowstagebinding
    id: recovery-email-injust-binding
    identifiers:
      target: !KeyOf recovery-flow
      stage: !KeyOf injust-recovery-email
      order: 21
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf recovery-email-injust-binding
      policy: !KeyOf brand-injust
      order: 0
  - model: authentik_flows.flowstagebinding
    id: recovery-email-personal-binding
    identifiers:
      target: !KeyOf recovery-flow
      stage: !KeyOf personal-recovery-email
      order: 22
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf recovery-email-personal-binding
      policy: !KeyOf brand-personal
      order: 0
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf recovery-flow
      stage: !KeyOf password-prompt
      order: 30
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf recovery-flow
      stage: !KeyOf user-write
      order: 40
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf recovery-flow
      stage: !KeyOf user-login
      order: 100
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf recovery-identification-binding
      policy: !KeyOf recovery-unknown-user
      order: 0

  - model: authentik_stages_password.passwordstage
    id: password
    identifiers:
      name: account-password
    attrs:
      backends:
        - authentik.core.auth.InbuiltBackend
        - authentik.core.auth.TokenBackend
      configure_flow: !KeyOf password-change-flow
      failed_attempts_before_cancel: 5
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    id: mfa
    identifiers:
      name: mossyleaf-mfa
    attrs:
      device_classes:
        - static
        - totp
        - webauthn
      not_configured_action: skip
      webauthn_user_verification: preferred
  - model: authentik_stages_identification.identificationstage
    id: identification
    identifiers:
      name: mossyleaf-identification
    attrs:
      user_fields:
        - email
        - username
      password_stage: !KeyOf password
      webauthn_stage: !KeyOf mfa
      recovery_flow: !KeyOf recovery-flow
      enrollment_flow: null
      pretend_user_exists: true
      show_matched_user: false
      case_insensitive_matching: true
  - model: authentik_policies_expression.expressionpolicy
    id: mfa-skip-after-passkey
    identifiers:
      name: mossyleaf-mfa-skip-after-passkey
    attrs:
      expression: |
        flow_plan = request.context.get("flow_plan")
        if not flow_plan:
            return True
        return flow_plan.context.get("auth_method") != "auth_webauthn_pwl"
  - model: authentik_flows.flow
    id: authentication-flow
    identifiers:
      slug: mossyleaf-authentication
    attrs:
      name: mossyleaf - Sign in
      title: Sign in
      designation: authentication
      authentication: none
      compatibility_mode: true
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf authentication-flow
      stage: !KeyOf identification
      order: 10
  - model: authentik_flows.flowstagebinding
    id: mfa-binding
    identifiers:
      target: !KeyOf authentication-flow
      stage: !KeyOf mfa
      order: 30
    attrs:
      re_evaluate_policies: true
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf authentication-flow
      stage: !KeyOf user-login
      order: 100
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf mfa-binding
      policy: !KeyOf mfa-skip-after-passkey
      order: 10
    attrs:
      failure_result: true

  - model: authentik_brands.brand
    identifiers:
      default: true
    attrs:
      domain: !Env [MOSSYLEAF_ACCOUNTS_DOMAIN, accounts.mossyleaf.studio]
      branding_title: mossyleaf
      branding_logo: /static/dist/custom/logo.svg
      branding_favicon: /static/dist/custom/favicon.svg
      branding_default_flow_background: /static/dist/custom/background.svg
      branding_custom_css: !File [/web/dist/custom/branding.css, ""]
      flow_authentication: !KeyOf authentication-flow
      flow_recovery: !KeyOf recovery-flow
      flow_invalidation: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
      flow_user_settings: !Find [authentik_flows.flow, [slug, default-user-settings-flow]]
      flow_unenrollment: null
      attributes:
        context: mossyleaf
        settings:
          theme:
            base: light

  - model: authentik_brands.brand
    identifiers:
      domain: !Env [INJUST_ACCOUNTS_DOMAIN, accounts.injustmusic.com]
    attrs:
      branding_title: Injust
      branding_logo: /static/dist/custom/injust/logo.svg
      branding_favicon: /static/dist/custom/injust/favicon.svg
      branding_default_flow_background: /static/dist/custom/injust/background.svg
      branding_custom_css: !File [/web/dist/custom/injust/branding.css, ""]
      flow_authentication: !KeyOf authentication-flow
      flow_recovery: !KeyOf recovery-flow
      flow_invalidation: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
      flow_user_settings: !Find [authentik_flows.flow, [slug, default-user-settings-flow]]
      flow_unenrollment: null
      attributes:
        context: injust
        settings:
          theme:
            base: dark

  - model: authentik_brands.brand
    identifiers:
      domain: !Env [PERSONAL_ACCOUNTS_DOMAIN, accounts.duprat.cloud]
    attrs:
      branding_title: duprat.cloud
      branding_logo: /static/dist/custom/personal/logo.svg
      branding_favicon: /static/dist/custom/personal/favicon.svg
      branding_default_flow_background: /static/dist/custom/personal/background.svg
      branding_custom_css: !File [/web/dist/custom/personal/branding.css, ""]
      flow_authentication: !KeyOf authentication-flow
      flow_recovery: !KeyOf recovery-flow
      flow_invalidation: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
      flow_user_settings: !Find [authentik_flows.flow, [slug, default-user-settings-flow]]
      flow_unenrollment: null
      attributes:
        context: personal
        settings:
          theme:
            base: light
