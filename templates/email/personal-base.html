{% load i18n %}{% get_current_language as language %}<!DOCTYPE html>
<html lang="{{ language|slice:':2' }}">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>duprat.cloud</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #e9edf2; color: #2b2d2a; font-family: Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 15px; line-height: 1.55;">
    <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0" style="background-color: #e9edf2;">
      <tr>
        <td align="center" style="padding: 40px 16px;">
          <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0" style="max-width: 480px;">
            <tr>
              <td style="padding: 0 4px 20px; font-family: Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 650; font-size: 24px; color: #16181d;">
                duprat<span style="color: #2f5d8a;">.cloud</span>
              </td>
            </tr>
            <tr>
              <td style="background-color: #ffffff; border: 1px solid #e3e4e0; border-radius: 12px; padding: 32px 28px;">
                {% block content %}{% endblock %}
              </td>
            </tr>
            <tr>
              <td style="padding: 20px 4px 0; font-size: 12px; color: #6b6e68;">
                {% block footer %}{% endblock %}
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
